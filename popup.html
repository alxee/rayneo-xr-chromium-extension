<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayNeo WebXR</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --panel: #141414;
      --inset: #0f0f0f;
      --border: #2e2e2e;
      --border-strong: #4a4a4a;
      --text: #ededed;
      --text-dim: #8a8a8a;
      --text-muted: #555555;
      --off: #2b2b2b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      border-radius: 0;
    }

    body {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.4;
    }

    .header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .content {
      padding: 16px;
    }

    .status-card {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
    }

    .status-value {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .status-value::before {
      content: "\25A0\00A0";
      font-size: 9px;
      color: var(--text-muted);
    }

    .status-value.connected {
      color: var(--text);
    }

    .status-value.connected::before {
      color: var(--text);
    }

    .status-value.disconnected {
      color: var(--text-muted);
    }

    .status-value.enabled {
      color: var(--text);
    }

    .status-value.enabled::before {
      color: var(--text);
    }

    .status-value.disabled {
      color: var(--text-muted);
    }

    .device-info {
      background: var(--inset);
      border: 1px solid var(--border);
      padding: 10px;
      margin-top: 10px;
    }

    .device-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .device-id {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }

    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px;
      margin-bottom: 12px;
    }

    .toggle-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 20px;
      flex: none;
    }

    .toggle input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: var(--off);
      border: 1px solid var(--border-strong);
      transition: background 0.15s, border-color 0.15s;
    }

    .toggle-slider::before {
      position: absolute;
      content: "";
      width: 14px;
      height: 14px;
      left: 2px;
      top: 2px;
      background: var(--text-dim);
      transition: transform 0.15s, background 0.15s;
    }

    .toggle input:checked + .toggle-slider {
      background: var(--text);
      border-color: var(--text);
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(20px);
      background: var(--bg);
    }

    .toggle input:disabled + .toggle-slider {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      margin-bottom: 8px;
    }

    .btn:last-of-type {
      margin-bottom: 0;
    }

    .btn:hover:not(:disabled) {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn:disabled {
      color: var(--text-muted);
      border-color: var(--border);
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .btn-primary:hover:not(:disabled) {
      background: transparent;
      color: var(--text);
    }

    .btn-primary:disabled {
      background: var(--off);
      color: var(--text-muted);
      border-color: var(--border);
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-icon {
      width: 14px;
      height: 14px;
      flex: none;
    }

    .orientation-display {
      background: var(--inset);
      border: 1px solid var(--border);
      padding: 10px;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 10px;
    }

    .orientation-display .label {
      color: var(--text);
      margin-right: 8px;
    }

    .warning {
      background: var(--panel);
      border: 1px solid var(--text);
      color: var(--text);
      padding: 10px 12px;
      font-size: 11px;
      margin-bottom: 12px;
      display: none;
    }

    .warning.show {
      display: block;
    }

    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      letter-spacing: 0.06em;
    }

    .footer a {
      color: var(--text-dim);
      text-decoration: none;
    }

    .footer a:hover {
      color: var(--text);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>RayNeo WebXR</h1>
  </div>

  <div class="content">
    <div id="webhid-warning" class="warning">
      WebHID is not supported in this browser. Please use Chrome, Edge, or Opera.
    </div>

    <div class="toggle-container">
      <span class="toggle-label">Enable Extension</span>
      <label class="toggle">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="toggle-container">
      <span class="toggle-label">VR Mode On This Site</span>
      <label class="toggle">
        <input type="checkbox" id="vrforce-toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="toggle-container">
      <span class="toggle-label">Auto Mode Switch</span>
      <label class="toggle" title="Automatically switch the glasses between 2D and SBS (side-by-side) when a VR session starts and ends">
        <input type="checkbox" id="automode-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Status</span>
        <span id="connection-status" class="status-value disconnected">Disconnected</span>
      </div>
      <div class="status-row">
        <span class="status-label">Extension</span>
        <span id="enabled-status" class="status-value enabled">Enabled</span>
      </div>

      <div id="device-info" class="device-info" style="display: none;">
        <div id="device-name" class="device-name">RayNeo Air 4 Pro</div>
        <div id="device-id" class="device-id">VID: 0x1bbb PID: 0xaf50</div>
      </div>

      <div id="orientation-display" class="orientation-display" style="display: none;">
        <span class="label">Q:</span>
        <span id="orientation-values">w:1.00 x:0.00 y:0.00 z:0.00</span>
      </div>
    </div>

    <button id="connect-btn" class="btn btn-primary">
      Connect RayNeo Glasses
    </button>

    <button id="recenter-btn" class="btn" disabled>
      Recenter View
    </button>

    <button id="entervr-btn" class="btn" disabled>
      Enter VR (player)
    </button>

    <button id="yttrack-btn" class="btn icon-btn" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="15" r="4"/>
        <circle cx="18" cy="15" r="4"/>
        <path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/>
        <path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/>
        <path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/>
      </svg>
      <span>YouTube tracking</span>
    </button>
  </div>

  <div class="footer">
    Port of <a href="https://github.com/bfvogel/viture-webxr-extension">Viture WebXR</a> for RayNeo
  </div>

  <script src="popup.js"></script>
</body>
</html>
