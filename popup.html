<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RayNeo WebXR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 320px;
      background: #1a1a2e;
      color: #eee;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 16px;
      text-align: center;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .header .subtitle {
      font-size: 12px;
      opacity: 0.8;
    }

    .content {
      padding: 16px;
    }

    .status-card {
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .status-row:last-child {
      margin-bottom: 0;
    }

    .status-label {
      font-size: 13px;
      color: #888;
    }

    .status-value {
      font-size: 13px;
      font-weight: 500;
    }

    .status-value.connected {
      color: #4ade80;
    }

    .status-value.disconnected {
      color: #f87171;
    }

    .status-value.enabled {
      color: #4ade80;
    }

    .status-value.disabled {
      color: #888;
    }

    .device-info {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
    }

    .device-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .device-id {
      font-size: 11px;
      color: #666;
      font-family: monospace;
    }

    .toggle-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #16213e;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }

    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #374151;
      transition: 0.3s;
      border-radius: 26px;
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(22px);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }

    .btn:last-child {
      margin-bottom: 0;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #374151;
      color: #fff;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      flex: none;
    }

    .orientation-display {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #888;
      margin-top: 12px;
    }

    .orientation-display .label {
      color: #667eea;
      margin-right: 8px;
    }

    .warning {
      background: #7c2d12;
      color: #fed7aa;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }

    .warning.show {
      display: block;
    }

    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #16213e;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>RayNeo WebXR</h1>
    <div class="subtitle">Head tracking for WebXR sites</div>
  </div>

  <div class="content">
    <div id="webhid-warning" class="warning">
      WebHID is not supported in this browser. Please use Chrome, Edge, or Opera.
    </div>

    <div class="toggle-container">
      <span class="toggle-label">Enable Extension</span>
      <label class="toggle">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="status-card">
      <div class="status-row">
        <span class="status-label">Status</span>
        <span id="connection-status" class="status-value disconnected">Disconnected</span>
      </div>
      <div class="status-row">
        <span class="status-label">Extension</span>
        <span id="enabled-status" class="status-value enabled">Enabled</span>
      </div>

      <div id="device-info" class="device-info" style="display: none;">
        <div id="device-name" class="device-name">RayNeo Air 4 Pro</div>
        <div id="device-id" class="device-id">VID: 0x1bbb PID: 0xaf50</div>
      </div>

      <div id="orientation-display" class="orientation-display" style="display: none;">
        <span class="label">Q:</span>
        <span id="orientation-values">w:1.00 x:0.00 y:0.00 z:0.00</span>
      </div>
    </div>

    <button id="connect-btn" class="btn btn-primary">
      Connect RayNeo Glasses
    </button>

    <button id="recenter-btn" class="btn btn-secondary" disabled>
      Recenter View
    </button>

    <button id="entervr-btn" class="btn btn-secondary" disabled>
      Enter VR (player)
    </button>

    <button id="yttrack-btn" class="btn btn-secondary icon-btn" disabled>
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="15" r="4"/>
        <circle cx="18" cy="15" r="4"/>
        <path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/>
        <path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/>
        <path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/>
      </svg>
      <span>YouTube tracking</span>
    </button>

    <button id="vrforce-btn" class="btn btn-secondary">
      VR mode on this site (toggle)
    </button>
  </div>

  <div class="footer">
    Port of <a href="https://github.com/bfvogel/viture-webxr-extension">Viture WebXR</a> for RayNeo
  </div>

  <script src="popup.js"></script>
</body>
</html>
